  <path d="M2 18 H9 l2.2 -3.4 L13.4 23 L16 8 L18.8 24.5 L21.4 16.6 h2.2 l1.6 -2.6 1.6 2.6 H30"
        fill="none" stroke="#7fb2f0" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
